# FLASH AGENT — Render Blueprint (free tier friendly)
# Push this repo to GitHub, then: Render → New → Blueprint → pick the repo.
services:
  - type: web
    name: flash-agent
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /var/data
      - key: APP_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_INITIAL_PASSWORD
        sync: false          # set it in the dashboard, never in the repo
      - key: OPENAI_API_KEY
        sync: false          # set it in the dashboard
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: ALLOW_REGISTRATION
        value: "true"
    disk:
      name: flash-data
      mountPath: /var/data
      sizeGB: 1

