services:
  flash-agent:
    build: .
    container_name: flash-agent
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - flash-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  flash-data:

