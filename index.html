<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05060d" />
<title>FLASH AGENT — Your Intelligence. Beyond Limits.</title>
<meta name="description" content="FLASH AGENT is an advanced AI platform: chat, code, vision, voice and memory in one intelligence core." />
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/favicon.svg" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/css/app.css" />
</head>
<body>
<div class="aurora"></div>
<div class="grid-veil"></div>

<!-- ══════════ AUTH ══════════ -->
<section id="authScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="logo-row">
      <img src="/assets/logo.svg" alt="FLASH AGENT" />
      <h2 id="authTitle">FLASH AGENT</h2>
      <p class="tag" id="authTag">Your Intelligence. Beyond Limits.</p>
    </div>

    <form id="loginForm" autocomplete="on">
      <div class="field">
        <label for="loginUser">Username or email</label>
        <input class="input" id="loginUser" name="username" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="loginPass">Password</label>
        <input class="input" id="loginPass" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn primary" style="width:100%" type="submit">Enter FLASH AGENT</button>
      <div class="auth-switch">No account yet? <button type="button" id="toRegister">Create one</button></div>
      <div class="auth-switch" style="margin-top:6px"><a href="/admin" style="color:var(--text-mute);font-size:12px">Administrator</a></div>
    </form>

    <form id="registerForm" class="hidden" autocomplete="on">
      <div class="field">
        <label for="regUser">Username</label>
        <input class="input" id="regUser" name="username" autocomplete="username" minlength="3" required />
      </div>
      <div class="field">
        <label for="regEmail">Email <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
        <input class="input" id="regEmail" name="email" type="email" autocomplete="email" />
      </div>
      <div class="field">
        <label for="regPass">Password</label>
        <input class="input" id="regPass" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </div>
      <button class="btn primary" style="width:100%" type="submit">Create account</button>
      <div class="auth-switch">Already registered? <button type="button" id="toLogin">Sign in</button></div>
    </form>
  </div>
</section>

<!-- ══════════ APP ══════════ -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <img src="/assets/logo.svg" alt="" />
      <div class="brand-text">
        <span class="brand-name" id="brandName">FLASH AGENT</span>
        <span class="brand-sub" id="brandSub">INTELLIGENCE CORE</span>
      </div>
    </div>

    <button class="btn-new" id="newChatBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>

    <div class="side-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="convSearch" placeholder="Search conversations" />
    </div>

    <div class="conv-list" id="convList"></div>

    <div class="side-foot">
      <button class="side-link" id="memoryBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3a4 4 0 0 0-4 4v1a3 3 0 0 0 0 6v1a4 4 0 0 0 8 0v-1a3 3 0 0 0 0-6V7a4 4 0 0 0-4-4Z"/></svg>
        Flash Memory <span id="memCount" class="pill" style="margin-left:auto;padding:1px 7px;font-size:10px"></span>
      </button>
      <button class="side-link" id="voiceBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M12 3v12"/><path d="M8 6v6M16 6v6M4 9v3M20 9v3"/><circle cx="12" cy="18" r="3"/></svg>
        Flash Voice settings
      </button>
      <button class="side-link" id="accountBtn">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
        Account &amp; password
      </button>
      <div class="user-chip">
        <div class="avatar" id="userAvatar">?</div>
        <div class="user-meta"><b id="userName">—</b><span id="userRole">user</span></div>
        <button class="icon-btn" id="logoutBtn" title="Sign out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 17l5-5-5-5"/><path d="M20 12H9"/><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"/></svg>
        </button>
      </div>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn hamburger" id="hamburger" aria-label="Open sidebar">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>

      <div class="mode-tabs" id="modeTabs">
        <button class="mode-tab active" data-mode="chat"><span>💬</span><span class="lbl">Chat</span></button>
        <button class="mode-tab" data-mode="code"><span>⌨️</span><span class="lbl">Code</span></button>
        <button class="mode-tab" data-mode="vision"><span>👁️</span><span class="lbl">Vision</span></button>
        <button class="mode-tab" data-mode="translate"><span>🌐</span><span class="lbl">Translate</span></button>
      </div>

      <div class="top-actions">
        <span class="pill model" id="modelPill" title="Active AI model">—</span>
        <span class="pill" id="aiPill"><span class="dot"></span><span id="aiPillText">checking…</span></span>
      </div>
    </header>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-zone">
      <div class="composer">
        <div class="composer-box">
          <div class="attach-preview hidden" id="attachPreview"></div>
          <textarea id="input" rows="1" placeholder="Ask FLASH anything…" maxlength="12000"></textarea>
          <div class="composer-bar">
            <button class="cbtn" id="attachBtn" title="Attach image (Flash Vision)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg>
            </button>
            <button class="cbtn" id="micBtn" title="Record voice (Flash Voice)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
            </button>
            <button class="cbtn" id="speakToggle" title="Read replies aloud">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>
            </button>
            <span class="sp"></span>
            <button class="send-btn" id="sendBtn" title="Send (Enter)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <p class="composer-hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line · <span id="quotaHint"></span></p>
      </div>
    </div>
  </main>
</div>

<input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple class="hidden" />
<div class="toasts" id="toasts"></div>
<div id="modalRoot"></div>

<script src="/js/markdown.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
